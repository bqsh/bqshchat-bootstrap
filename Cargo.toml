[package]
name = "bqshchan"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.47.1", features = ["full"] }

libp2p = { version = "0.56.0", features = ["gossipsub", "yamux", "noise", "dns", "tcp", "tokio", "mdns", "quic", "websocket"] }

futures = "0.3.31"
anyhow = "1.0.99"

tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }

rand = "0.8"
sysinfo = "0.37"
libp2p-webrtc = { version = "0.9.0-alpha.1", features = ["tokio"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"

env_logger = "0.11.8"
log = "0.4.27"

tokio-socks = "0.5.2"
torut = "0.2.1"
lazy_static = "1.2.0"



libp2p-tokio-socks5 = { path = "/home/bituum/RustroverProjects/rust-libp2p-tokio-socks5" }
