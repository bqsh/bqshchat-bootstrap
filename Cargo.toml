[package]
name = "bqshchan"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.47.1", features = ["full"] }
libp2p = { version = "0.56.0", features = ["gossipsub", "yamux", "noise", "dns", "tcp", "tokio", "mdns"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
futures = "0.3.31"
anyhow = "1.0.99"
env_logger = "0.11.8"
log = "0.4.27"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }